      const [saveToPresetChecked, setSaveToPresetChecked] = useState(true);

      const [currentHomeWeight, setCurrentHomeWeight] = useState(initial.currentHomeWeight || 74.2);
      const [homeWeightLogs, setHomeWeightLogs] = useState(initial.homeWeightLogs || INITIAL_HOME_WEIGHT_LOGS);
      const [newWeightInput, setNewWeightInput] = useState({ date: '11/04', weight: '', note: '' });
      const [weeklyWeights, setWeeklyWeights] = useState(initial.weeklyWeights);
      const [lastWeekAvg, setLastWeekAvg] = useState(initial.lastWeekAvg);
      const [weeklyWorkoutsDone, setWeeklyWorkoutsDone] = useState(initial.weeklyWorkoutsDone);
      const [weeklyAvgSteps, setWeeklyAvgSteps] = useState(initial.weeklyAvgSteps);
      const [fatigueLevel, setFatigueLevel] = useState(initial.fatigueLevel);
      const [isTwoWeeksStuck, setIsTwoWeeksStuck] = useState(initial.isTwoWeeksStuck);
      const [isTravelWeek, setIsTravelWeek] = useState(initial.isTravelWeek);
      const [weightHistory, setWeightHistory] = useState(initial.weightHistory);

      const [workoutLogs, setWorkoutLogs] = useState(initial.workoutLogs);
      const [dailySteps, setDailySteps] = useState(initial.dailySteps);

      const [exportFormat, setExportFormat] = useState('txt');
      const [copied, setCopied] = useState(false);
      const [downloadedNotice, setDownloadedNotice] = useState('');
      const [cloudStatus, setCloudStatus] = useState('雲端連線就緒');
      const [isSyncing, setIsSyncing] = useState(false);
      const [cloudHistoryList, setCloudHistoryList] = useState([]);
      const [syncCodeInput, setSyncCodeInput] = useState('');
      const [lastSavedTime, setLastSavedTime] = useState('已同步');
      const [confirmReset, setConfirmReset] = useState(false);

      const currentFullState = useMemo(() => ({
        selectedDay, selectedMilestone, modeOverride, portionMultiplier, edamameCount,
        savedCustomFoods, foodLogs, waterMl, workoutLogs, dailySteps, currentHomeWeight,
        homeWeightLogs, weeklyWeights, lastWeekAvg, weeklyWorkoutsDone, weeklyAvgSteps,
        fatigueLevel, isTwoWeeksStuck, isTravelWeek, weightHistory
      }), [
        selectedDay, selectedMilestone, modeOverride, portionMultiplier, edamameCount,
        savedCustomFoods, foodLogs, waterMl, workoutLogs, dailySteps, currentHomeWeight,
        homeWeightLogs, weeklyWeights, lastWeekAvg, weeklyWorkoutsDone, weeklyAvgSteps,
        fatigueLevel, isTwoWeeksStuck, isTravelWeek, weightHistory
      ]);

      // 本機自動暫存
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(currentFullState));
          const now = new Date();
          setLastSavedTime(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        } catch (e) {
          setLastSavedTime('暫存受限');
        }
      }, [currentFullState]);

      // --- 核心：Google Apps Script 雲端自動讀取 ---
      const fetchFromGoogleSheet = async () => {
        try {
          setCloudStatus('正在從試算表讀取...');
          const res = await fetch(GAS_API_URL);
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            setCloudHistoryList(data);
            const latest = data[data.length - 1];
            if (latest.weight && !isNaN(parseFloat(latest.weight))) {
              const cloudWeight = parseFloat(latest.weight);
              setCurrentHomeWeight(cloudWeight);
            }
            setCloudStatus(`已同步雲端 (${data.length} 筆歷史)`);
          } else {
            setCloudStatus('試算表尚無歷史資料');
          }
        } catch (e) {
          setCloudStatus('離線讀取模式 (本機已存)');
        }
      };

      useEffect(() => {
        fetchFromGoogleSheet();
      }, []);

      // --- 核心：一鍵同步推播至 Google 試算表 ---
      const pushToGoogleSheet = async () => {
        setIsSyncing(true);
        setCloudStatus('正在上傳雲端試算表...');
        const payload = {
          date: APP_DATE,
          weight: currentHomeWeight,
          kcal: totals.kcal.toFixed(1),
          protein: totals.p.toFixed(1),
          carbs: totals.c.toFixed(1),
          fat: totals.f.toFixed(1),
          steps: dailySteps,
          foodLogs: foodLogs.map(f => ({ name: f.name, kcal: f.kcal, p: f.p, c: f.c || 0, f: f.f || 0 }))
        };

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setCloudStatus('✅ 已成功記錄進 Google 試算表！');
          setDownloadedNotice('✅ 試算表已更新！');
          setTimeout(() => {
            fetchFromGoogleSheet();
            setDownloadedNotice('');
          }, 2000);
        } catch (err) {
          setCloudStatus('上傳逾時，已轉存本機');
        } finally {
          setIsSyncing(false);
        }
      };

      const applyImportedState = (parsed) => {
        if (!parsed || typeof parsed !== 'object') return;
        if (parsed.selectedDay) setSelectedDay(parsed.selectedDay);
        if (parsed.selectedMilestone) setSelectedMilestone(parsed.selectedMilestone);
        if (parsed.savedCustomFoods) setSavedCustomFoods(parsed.savedCustomFoods);
        if (parsed.foodLogs) setFoodLogs(parsed.foodLogs);
        if (typeof parsed.waterMl === 'number') setWaterMl(parsed.waterMl);
        if (parsed.workoutLogs) setWorkoutLogs(parsed.workoutLogs);
        if (typeof parsed.dailySteps === 'number') setDailySteps(parsed.dailySteps);
        if (typeof parsed.currentHomeWeight === 'number') setCurrentHomeWeight(parsed.currentHomeWeight);
        if (parsed.homeWeightLogs) setHomeWeightLogs(parsed.homeWeightLogs);
        if (parsed.weightHistory) setWeightHistory(parsed.weightHistory);
        setDownloadedNotice('✅ 跨裝置進度已成功載入！');
        setTimeout(() => setDownloadedNotice(''), 3000);
      };

      const exportBackupJsonFile = () => {
        const jsonStr = JSON.stringify(currentFullState, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Matt_減脂跨裝置進度檔_${APP_DATE}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setDownloadedNotice('已下載 .JSON 進度檔');
        setTimeout(() => setDownloadedNotice(''), 2500);
      };

      const handleImportJsonFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            applyImportedState(parsed);
          } catch (err) {
            alert('檔案格式錯誤，請確認選擇的是 .json 進度備份檔！');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleResetAll = () => {
        if (!confirmReset) {
          setConfirmReset(true);
          setTimeout(() => setConfirmReset(false), 3500);
          return;
        }
        localStorage.removeItem(STORAGE_KEY);
        applyImportedState(DEFAULT_STATE);
        setConfirmReset(false);
      };

      const currentDayObj = DAYS_OF_WEEK.find(d => d.id === selectedDay) || DAYS_OF_WEEK[1];
      const activeMode = modeOverride || currentDayObj.type;
      const isWeekday = activeMode === 'weekday';

      const targets = useMemo(() => {
        if (isWeekday) {
          return {
            label: '平日精準控卡模式',
            kcal: 1650, kcalMin: 1550, kcalMax: 1750,
            pMin: 130, pMax: 155, fMin: 40, fMax: 55, cMin: 140, cMax: 185,
            vegMin: 3, waterMin: 2500
          };
        } else {
          return {
            label: '週末外食彈性模式',
            kcal: 1850, kcalMin: 1700, kcalMax: 1950,
            pMin: 125, pMax: 160, fMin: 40, fMax: 65, cMin: 120, cMax: 220,
            vegMin: 2.5, waterMin: 2500
          };
        }
      }, [isWeekday]);

      const totals = useMemo(() => {
        return foodLogs.reduce((acc, item) => ({
          kcal: acc.kcal + Number(item.kcal || 0),
          p: acc.p + Number(item.p || 0),
          f: acc.f + Number(item.f || 0),
          c: acc.c + Number(item.c || 0),
          veg: acc.veg + Number(item.veg || 0),
        }), { kcal: 0, p: 0, f: 0, c: 0, veg: 0 });
      }, [foodLogs]);

      const itemCounts = useMemo(() => {
        const counts = {};
        foodLogs.forEach(log => {
          if (log.refId) counts[log.refId] = (counts[log.refId] || 0) + (log.mult || 1);
        });
        return counts;
      }, [foodLogs]);

      const getStatus = (val, min, max, isStrictMax = false) => {
        if (val < min) return { text: '待補足', color: 'text-amber-300 bg-amber-950/70 border-amber-700/50' };
        if (isStrictMax && val > max) return { text: '超標', color: 'text-rose-300 bg-rose-950/70 border-rose-700/50' };
        if (!isStrictMax && val > max * 1.1) return { text: '偏高', color: 'text-rose-300 bg-rose-950/70 border-rose-700/50' };
        return { text: '達標', color: 'text-emerald-300 bg-emerald-950/70 border-emerald-700/50' };
      };

      const smartFoodSuggestions = useMemo(() => {
        const kcalDiff = Math.round(targets.kcal - totals.kcal);
        const pDiff = Math.max(0, targets.pMin - totals.p);
        const vegDiff = Math.max(0, targets.vegMin - totals.veg);
        const waterDiff = Math.max(0, targets.waterMin - waterMl);

        const chickenNeeded = (pDiff / 31.0).toFixed(1);
        const soyProteinNeeded = (pDiff / 27.0).toFixed(1);
        const shangYouNeeded = (pDiff / 22.2).toFixed(1);
        const edamameGramsOrCount = Math.ceil(pDiff / 0.11);

        const actions = [];
        if (totals.kcal > targets.kcalMax) {
          const overKcal = Math.round(totals.kcal - targets.kcal);
          actions.push(`⚠️ 熱量已超標 ${overKcal} kcal：請停止攝取粉角、蜂蜜綠茶或高脂肉類，多喝「無糖玉米鬚茶」或「大麥若葉青汁」高鉀排鈉。`);
          if (pDiff > 5) {
            actions.push(`蛋白質尚缺 ${pDiff.toFixed(1)}g：建議用極低熱量的「滴雞精 (${(pDiff / 3.9).toFixed(0)}包)」或「大豆分離蛋白粉 (${soyProteinNeeded}匙)」純補蛋白質。`);
          }
        } else {
          if (pDiff > 6) {
            actions.push(`🎯 蛋白質尚缺 ${pDiff.toFixed(1)}g（熱量尚餘 ${kcalDiff} kcal）：建議補充「去皮雞胸肉 ${chickenNeeded} 份」或「大豆分離蛋白 ${soyProteinNeeded} 匙」或「上友高蛋白乳 ${shangYouNeeded} 瓶」（若吃純毛豆仁約需 ${edamameGramsOrCount} 顆）。`);
          } else {
            actions.push(`✅ 今日蛋白質已達標 (${totals.p.toFixed(1)}g)！`);
            if (kcalDiff > 120) {
              actions.push(`熱量尚有 ${kcalDiff} kcal 餘裕：可享用「乾煎蘿蔔糕 1–2 小片」或「香吉士半個 + 堅果雙和茶 1 包」。`);
            }
          }
        }
        if (vegDiff > 0) actions.push(`🥦 蔬菜尚缺 ${vegDiff.toFixed(1)} 份：請補「青花菜＋美生菜 1 份」或「杏鮑菇半碗」。`);
        if (waterDiff > 0) actions.push(`💧 水份尚缺 ${waterDiff} mL。`);

        return {
          summaryText: actions.join(' '),
          pDiff, kcalDiff, vegDiff, chickenNeeded, soyProteinNeeded, shangYouNeeded, edamameGramsOrCount
        };
      }, [totals, targets, waterMl]);

      const addFoodWithMultiplier = (item, customMult = null) => {
        const m = customMult !== null ? customMult : portionMultiplier;
        const suffix = m === 1 ? '' : ` ×${m}`;
        setFoodLogs(prev => [
          ...prev,
          {
            id: Date.now() + Math.random(),
            refId: item.id,
            mult: m,
            name: `${item.name}${suffix}`,
            unit: item.unit || '',
            kcal: Number((item.kcal * m).toFixed(1)),
            p: Number((item.p * m).toFixed(1)),
            f: Number(((item.f || 0) * m).toFixed(1)),
            c: Number(((item.c || 0) * m).toFixed(1)),
            veg: Number(((item.veg || 0) * m).toFixed(1)),
          }
        ]);
      };

      const removeLastByRefId = (refId) => {
        setFoodLogs(prev => {
          const idx = [...prev].reverse().findIndex(x => x.refId === refId);
          if (idx === -1) return prev;
          const realIdx = prev.length - 1 - idx;
          return prev.filter((_, i) => i !== realIdx);
        });
      };

      const addCustomEdamame = () => {
        const count = Number(edamameCount) || 100;
        const ratio = count / 100;
        setFoodLogs(prev => [
          ...prev,
          {
            id: Date.now() + Math.random(),
            refId: 'mp4',
            mult: Number(ratio.toFixed(2)),
            name: `純毛豆仁 (${count} 顆 / 約 ${Math.round(85 * ratio)}g)`,
            unit: `${count} 顆`,
            kcal: Number((106 * ratio).toFixed(1)),
            p: Number((11.0 * ratio).toFixed(1)),
            f: Number((4.5 * ratio).toFixed(1)),
            c: Number((6.5 * ratio).toFixed(1)),
            veg: Number((0.5 * ratio).toFixed(1)),
          }
        ]);
      };

      const applyCombo = (combo) => {
        const newEntries = combo.items.map(refId => {
          const found = MATT_CORE_FOODS.find(f => f.id === refId);
          if (!found) return null;
          return {
            id: Date.now() + Math.random(),
            refId: found.id,
            mult: 1,
            name: found.name,
            unit: found.unit,
            kcal: found.kcal,
            p: found.p,
            f: found.f || 0,
            c: found.c || 0,
            veg: found.veg || 0,
          };
        }).filter(Boolean);
        setFoodLogs(prev => [...prev, ...newEntries]);
      };

      const autoCalculatedKcal = useMemo(() => {
        const p = parseFloat(customFood.p) || 0;
        const f = parseFloat(customFood.f) || 0;
        const c = parseFloat(customFood.c) || 0;
        if (p === 0 && f === 0 && c === 0) return 0;
        return Math.round(p * 4 + c * 4 + f * 9);
      }, [customFood.p, customFood.f, customFood.c]);

      const handleAddCustomFood = (e) => {
        e.preventDefault();
        if (!customFood.name) return;
        const finalKcal = customFood.kcal !== '' ? parseFloat(customFood.kcal) : autoCalculatedKcal;
        const pVal = parseFloat(customFood.p) || 0;
        const fVal = parseFloat(customFood.f) || 0;
        const cVal = parseFloat(customFood.c) || 0;
        const vegVal = parseFloat(customFood.veg) || 0;
        const newCustomId = `sc_${Date.now()}`;

        if (saveToPresetChecked) {
          setSavedCustomFoods(prev => [
            ...prev,
            { id: newCustomId, name: customFood.name, unit: '1 份 (自訂常用)', kcal: finalKcal, p: pVal, f: fVal, c: cVal, veg: vegVal }
          ]);
        }

        setFoodLogs(prev => [
          ...prev,
          { id: Date.now() + Math.random(), refId: saveToPresetChecked ? newCustomId : undefined, mult: 1, name: customFood.name, kcal: finalKcal, p: pVal, f: fVal, c: cVal, veg: vegVal }
        ]);
        setCustomFood({ name: '', kcal: '', p: '', f: '', c: '', veg: '0' });
      };

      const deleteSavedCustomFood = (id) => setSavedCustomFoods(prev => prev.filter(item => item.id !== id));
      const removeFood = (id) => setFoodLogs(prev => prev.filter(item => item.id !== id));

      const handleAddHomeWeightLog = (e) => {
        e.preventDefault();
        const w = parseFloat(newWeightInput.weight);
        if (!newWeightInput.date || isNaN(w) || w <= 0) return;
        const prevW = homeWeightLogs.length > 0 ? homeWeightLogs[homeWeightLogs.length - 1].weight : 75.0;
        const diff = w - prevW;
        const diffStr = diff === 0 ? '持平' : `${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)} kg`;

        const updated = [
          ...homeWeightLogs,
          { date: newWeightInput.date, weight: w, change: diffStr, note: newWeightInput.note || (w < prevW ? '持續突破新低！' : '日常波動觀察') }
        ];
        setHomeWeightLogs(updated);
        setCurrentHomeWeight(w);
        setNewWeightInput({ date: '', weight: '', note: '' });
      };

      const weeklyStats = useMemo(() => {
        const validWeights = weeklyWeights.map(w => parseFloat(w)).filter(w => !isNaN(w) && w > 0);
        const currentAvg = validWeights.length > 0 ? (validWeights.reduce((a, b) => a + b, 0) / validWeights.length) : currentHomeWeight;
        const prevAvg = parseFloat(lastWeekAvg) || 74.6;
        const diff = currentAvg - prevAvg;
        const lossAmount = prevAvg - currentAvg;

        const milestoneObj = MILESTONES.find(m => m.id === selectedMilestone) || MILESTONES[3];
        const distToMilestone = currentAvg - milestoneObj.weight;

        const startHomeWeight = 75.0;
        const targetHomeWeight = 70.0;
        const totalToLose = startHomeWeight - targetHomeWeight;
        const lostSoFar = startHomeWeight - currentHomeWeight;
        const remainingToGoal = Math.max(0, currentHomeWeight - targetHomeWeight);
        const progressPct = Math.min(100, Math.max(0, (lostSoFar / totalToLose) * 100));
        const totalLostSinceJuly = (81.2 - currentHomeWeight).toFixed(1);

        let decisionTitle = '🔥 突破 74.6 kg 鎖死平台！11/03 創下 74.2 kg 新低';
        let decisionDetail = `下一步：今日單日下降 −0.4 kg 正式突破連續三日 74.6 kg 平台，距離終極目標「家中空腹 70.0 kg」僅剩 ${remainingToGoal.toFixed(1)} kg！請維持「去皮雞胸肉/大豆蛋白 + 青花菜 + 玉米鬚茶」高鉀高蛋白組合，穩步推進至 11/08 節點 (73.4 kg)。`;

        return {
          currentAvg: currentAvg.toFixed(2),
          diff: diff.toFixed(2),
          lossAmount: lossAmount.toFixed(2),
          milestoneTarget: milestoneObj.weight,
          distToMilestone: distToMilestone.toFixed(2),
          lostSoFar: lostSoFar.toFixed(1),
          remainingToGoal: remainingToGoal.toFixed(1),
          progressPct: progressPct.toFixed(0),
          totalLostSinceJuly,
          decisionTitle,
          decisionDetail
        };
      }, [weeklyWeights, lastWeekAvg, selectedMilestone, currentHomeWeight]);

      const saveCurrentWeekToHistory = () => {
        const avgNum = parseFloat(weeklyStats.currentAvg);
        if (!avgNum || isNaN(avgNum)) return;
        setWeightHistory(prev => {
          const exists = prev.findIndex(item => item.id === selectedMilestone);
          const newEntry = {
            id: selectedMilestone,
            avgWeight: avgNum,
            steps: weeklyAvgSteps,
            note: `${weeklyStats.diff > 0 ? '+' : ''}${weeklyStats.diff}kg`
          };
          if (exists >= 0) {
            const updated = [...prev];
            updated[exists] = newEntry;
            return updated;
          }
          return [...prev, newEntry];
        });
      };

      const updateWorkoutLog = (id, field, value) => {
        setWorkoutLogs(prev => ({
          ...prev,
          [id]: { ...(prev[id] || { weight: '', reps: '', done: false }), [field]: value }
        }));
      };

      const exportContents = useMemo(() => {
        const kcalStatus = getStatus(totals.kcal, targets.kcalMin, targets.kcalMax, true).text;
        const pStatus = getStatus(totals.p, targets.pMin, targets.pMax, false).text;
        const fStatus = getStatus(totals.f, targets.fMin, targets.fMax, true).text;
        const cStatus = getStatus(totals.c, targets.cMin, targets.cMax, false).text;
        const vegStatus = totals.veg >= targets.vegMin ? '達標' : '待補足';
        const waterStatus = waterMl >= targets.waterMin ? '達標' : '待補足';

        const txtFoodLines = foodLogs.map((f, i) => `${i + 1}. ${f.name} | ${f.kcal} kcal | P:${f.p}g F:${f.f || 0}g 醣(C):${f.c || 0}g`).join('\n');
        const txtHomeWeightLines = homeWeightLogs.map(w => `  - ${w.date}: ${Number(w.weight).toFixed(1)} kg (${w.change}) ${w.note}`).join('\n');

        const txtContent = `==================================================
【Matt 減脂執行日報】版本 ${APP_VERSION} ｜ 日期 ${APP_DATE} (${currentDayObj.label})
==================================================
🎯 終極目標：${GOAL_TITLE}
🏠 目前空腹：${currentHomeWeight.toFixed(1)} kg (距離目標尚差 ${weeklyStats.remainingToGoal} kg / 進度 ${weeklyStats.progressPct}%)
🏢 累計戰果：自 07/01 (81.2 kg) 累計總減重 −${weeklyStats.totalLostSinceJuly} kg

--------------------------------------------------
【1. 今日營養攝取總計】(${targets.label})
--------------------------------------------------
• 熱量 (kcal) ： ${totals.kcal.toFixed(1)} / ${targets.kcal} kcal [${kcalStatus}]
• 蛋白質 (P)  ： ${totals.p.toFixed(1)} / ${targets.pMin}–${targets.pMax} g [${pStatus}]
• 醣類/碳水(C)： ${totals.c.toFixed(1)} / ${targets.cMin}–${targets.cMax} g [${cStatus}]
• 脂肪 (F)    ： ${totals.f.toFixed(1)} / ${targets.fMin}–${targets.fMax} g [${fStatus}]
• 蔬菜與水份  ： 蔬菜 ${totals.veg.toFixed(1)} 份 [${vegStatus}] ｜ 飲水 ${waterMl} mL [${waterStatus}]
• 今日步數    ： ${dailySteps} 步

--------------------------------------------------
【2. 今日飲食入帳明細】(${foodLogs.length} 筆)
--------------------------------------------------
${txtFoodLines || '(尚無紀錄)'}

--------------------------------------------------
【3. 家中晨間空腹體重軌跡】
--------------------------------------------------
${txtHomeWeightLines}

--------------------------------------------------
【4. 下一步行動指令】
--------------------------------------------------
${smartFoodSuggestions.summaryText}
${weeklyStats.decisionTitle}：${weeklyStats.decisionDetail}
==================================================`;

        const mdFoodList = foodLogs.map(f => `- **${f.name}**: ${f.kcal} kcal (P:${f.p}g / F:${f.f || 0}g / 醣C:${f.c || 0}g)`).join('\n');
        const mdContent = `### 📊 Matt 減脂執行日報 (${APP_DATE}｜${currentDayObj.label}｜${APP_VERSION})

${mdFoodList || '- 尚無紀錄'}

**💡 下一步行動指令**：${smartFoodSuggestions.summaryText}`;

              setCopied(true);
              setDownloadedNotice(msg);
              setTimeout(() => { setCopied(false); setDownloadedNotice(''); }, 2200);
            }).catch(() => fallbackCopy(textToCopy, msg));
          } else {

          fallbackCopy(textToCopy, msg);
        }
      };

      const fallbackCopy = (text, msg) => {

        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        setCopied(true);

        const blob = new Blob(['\uFEFF' + content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Matt_減脂日報_${APP_DATE}_${currentDayObj.id}.${ext}`;
        document.body.appendChild(link);
        link.click();

                          onClick={() => setSelectedDay(dId)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${
                            selectedDay === dId ? 'bg-emerald-600/20 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          {dObj.label}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                      <tr className="border-b border-slate-800 font-mono text-slate-400">
                        <th className="py-2.5 px-2">完成</th>
                        <th className="py-2.5 px-2">動作名稱</th>
                        <th className="py-2.5 px-2">目標</th>
                        <th className="py-2.5 px-2">負重(kg)</th>
                        <th className="py-2.5 px-2">次數/分鐘</th>
                        <th className="py-2.5 px-2">加重判定</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {(WORKOUT_SCHEMAS[selectedDay] || []).map(ex => {
                        const log = workoutLogs[ex.id] || { weight: '', reps: '', done: false };
                        const shouldIncrease = ex.isMachine && parseInt(log.reps, 10) >= 12;
                        return (
                          <tr key={ex.id}>
                            <td className="py-2.5 px-2">
                              <input
                                type="checkbox"
                                checked={log.done}
                                onChange={e => updateWorkoutLog(ex.id, 'done', e.target.checked)}
                                className="w-4 h-4 accent-emerald-500"
                              />
                            </td>
                            <td className="py-2.5 px-2 font-medium text-white">{ex.name}</td>
                            <td className="py-2.5 px-2 font-mono text-slate-300">{ex.sets}×{ex.target}</td>
                            <td className="py-2.5 px-2">
                              {ex.isMachine ? (
                                <input
                                  type="number"
                                  value={log.weight}
                                  onChange={e => updateWorkoutLog(ex.id, 'weight', e.target.value)}
                                  className="w-16 bg-slate-950 border border-slate-800 rounded px-2 py-1 font-mono text-white"
                                />
                              ) : <span className="text-slate-500 font-mono">自重</span>}
                            </td>
                            <td className="py-2.5 px-2">
                              <input
                                type="number"
                                value={log.reps}
                                onChange={e => updateWorkoutLog(ex.id, 'reps', e.target.value)}
                                className="w-16 bg-slate-950 border border-slate-800 rounded px-2 py-1 font-mono text-white"
                              />
                            </td>
                            <td className="py-2.5 px-2">
                              {shouldIncrease ? (
                                <span className="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold">
                                  ⚡ 滿12下！下週加重至 {Number(log.weight || 0) + 2.5}kg+
                                </span>
                              ) : <span className="text-slate-400">{ex.note}</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 4: Google 試算表雲端同步中心 */}
            {activeTab === 'export' && (
              <div className="space-y-5">
                {/* 雲端試算表狀態卡 */}
                <div className="bg-slate-900 border border-emerald-500/40 rounded-xl p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        ☁️ Google 試算表自動同步與歷史做表中心
                      </h2>
                      <p className="text-xs text-slate-300 mt-1">
                        已綁定你的專屬 Google Apps Script API。在手機或電腦點擊「同步至試算表」，今日數據即刻寫入試算表下一列。
                      </p>
                    </div>
                    <button
                      onClick={pushToGoogleSheet}
                      disabled={isSyncing}
                      className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm shadow-md"
                    >
                      {isSyncing ? '正在傳送至 Google 試算表...' : '☁️ 立即同步至 Google 試算表'}
                    </button>
                  </div>

                  {/* 試算表歷史即時清單 */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-mono text-emerald-400 font-bold">
                        📋 雲端試算表現有紀錄清單 ({cloudHistoryList.length} 列)
                      </span>
                      <button onClick={fetchFromGoogleSheet} className="text-xs text-slate-400 hover:text-white">
                        🔄 重新載入雲端
                      </button>
                    </div>

                    {cloudHistoryList.length === 0 ? (
                      <p className="text-xs text-slate-500 py-3 text-center">試算表尚無資料，請點擊上方按鈕送出第一筆今日紀錄</p>
                    ) : (
                      <div className="overflow-x-auto max-h-56 overflow-y-auto border border-slate-800 rounded-lg">
                        <table className="w-full text-left text-xs font-mono">
                          <thead className="bg-slate-950 text-slate-400 sticky top-0">
                            <tr className="border-b border-slate-800">
                              <th className="py-2 px-2.5">記錄時間</th>
                              <th className="py-2 px-2.5">日期</th>
                              <th className="py-2 px-2.5">空腹體重</th>
                              <th className="py-2 px-2.5">熱量</th>
                              <th className="py-2 px-2.5">蛋白質 (P)</th>
                              <th className="py-2 px-2.5">碳水 (C)</th>
                              <th className="py-2 px-2.5">脂肪 (F)</th>
                              <th className="py-2 px-2.5">步數</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 bg-slate-950/60">
                            {cloudHistoryList.map((row, idx) => (
                              <tr key={idx} className="hover:bg-slate-800/30">
                                <td className="py-2 px-2.5 text-slate-400">{String(row.timestamp || '').slice(0, 16)}</td>
                                <td className="py-2 px-2.5 text-slate-200">{row.date}</td>
                                <td className="py-2 px-2.5 text-emerald-400 font-bold">{row.weight} kg</td>
                                <td className="py-2 px-2.5 text-amber-300">{row.kcal} kcal</td>
                                <td className="py-2 px-2.5 text-emerald-300">{row.protein} g</td>
                                <td className="py-2 px-2.5 text-cyan-300">{row.carbs} g</td>
                                <td className="py-2 px-2.5 text-slate-300">{row.fat} g</td>
                                <td className="py-2 px-2.5 text-slate-400">{row.steps}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>

                {/* 備援：檔案匯出與純文字日報 */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
                    <h3 className="text-base font-bold text-white">📄 本機日報匯出 (.TXT 記事本 / .CSV / .MD)</h3>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => downloadFile('txt')} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold">
                        下載 .TXT
                      </button>
                      <button onClick={() => downloadFile('csv')} className="px-3 py-1.5 rounded-lg bg-cyan-600 text-white text-xs font-bold">
                        下載 .CSV
                      </button>
                      <button onClick={() => copyTextSafe(activeExportText, '✅ 已複製日報內容！')} className="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white text-xs font-bold">
                        {copied ? '✅ 已複製！' : '📋 複製日報'}
                      </button>
                    </div>
                  </div>

                  <div className="flex gap-2 text-xs">
                    {[
                      { id: 'txt', label: '📄 .TXT 純文字' },
                      { id: 'csv', label: '📊 .CSV 試算表' },
                      { id: 'md', label: '📝 .MD 筆記' }
                    ].map(fmt => (
                      <button
                        key={fmt.id}
                        onClick={() => setExportFormat(fmt.id)}
                        className={`px-3 py-1.5 rounded-lg font-medium ${
                          exportFormat === fmt.id ? 'bg-emerald-600/20 text-emerald-300 border border-emerald-500/40' : 'bg-slate-950 text-slate-400'
                        }`}
                      >
                        {fmt.label}
                      </button>
                    ))}
                  </div>

                  <pre className="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-200 overflow-x-auto whitespace-pre-wrap leading-relaxed select-all">
                    {activeExportText}
                  </pre>
                </div>
              </div>
            )}
          </main>

          {/* 底部狀態列 */}
          <footer className="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur border-t border-emerald-500/30 px-3 sm:px-4 py-2.5 shadow-2xl">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-3">
              <div className="flex items-center gap-2 text-xs sm:text-sm text-slate-100 truncate">
                <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono text-xs font-bold shrink-0 border border-emerald-500/40">
                  下一步：
                </span>
                <span className="truncate font-medium">
                  {activeTab === 'weight' ? weeklyStats.decisionDetail : smartFoodSuggestions.summaryText}
                </span>
              </div>
              <span className="hidden md:inline-block text-[11px] font-mono text-slate-400 shrink-0">
                空腹：{currentHomeWeight.toFixed(1)}→70.0kg ｜ 今日：{totals.kcal.toFixed(0)}/{targets.kcal} kcal (P:{totals.p.toFixed(1)}g)
              </span>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
